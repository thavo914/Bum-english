services:
  app:
    build: .
    container_name: nephew-study-app
    ports:
      - "3001:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./english:/app/english
      - ./math:/app/math
      - ./public:/app/public
      - ./server.js:/app/server.js
    restart: unless-stopped
